name: Publish Spark Academy Quiz Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: spark-github-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Build and deploy static quiz pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current quiz files
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy quiz site
        id: deployment
        uses: actions/deploy-pages@v4
